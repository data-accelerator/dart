# Test fixtures for verify.sh. Not for production.
#
# Two pieces:
#   * origin — an nginx serving one large blob with Range support, so DART has
#     something to chunk. Self-contained, so verification works in an air-gapped
#     cluster with no external registry access.
#   * toolbox — a pod with curl. DART's own image is distroless and has no shell,
#     so `kubectl exec` into it is impossible by design; the checks run from here
#     instead, which also means they exercise real in-cluster networking rather
#     than a port-forward.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dart-origin-gen
data:
  gen.sh: |
    #!/bin/sh
    set -eu
    # Generate 64 MiB of *position-sensitive* content: every 16-byte line holds its
    # own line number. This matters. Filler such as all-zeros would make every
    # block identical, so an off-by-one in block assembly or range mapping would
    # still produce a matching checksum and the test would pass while broken.
    #
    # 64 MiB is sized against the granularity statefulset.yaml runs with, not
    # against the defaults: at -chunk-size=8MiB it is 8 chunks (so several owners)
    # and at -block-size=1MiB it is 64 blocks. Under the default 256MiB chunk it
    # would be a *single* chunk with a single owner, which is why the manifest
    # shrinks the granularity rather than the fixture growing to 512 MiB.
    seq -f '%015.0f' 1 4194304 | head -c 67108864 > /data/blob.bin
    # A second, smaller object to exercise the short-tail-block path.
    seq -f '%015.0f' 1 70000 | head -c 1048577 > /data/odd.bin
    ls -l /data
---
apiVersion: v1
kind: Service
metadata:
  name: dart-origin
  labels: {app: dart-origin}
spec:
  selector: {app: dart-origin}
  ports:
    - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-origin
  labels: {app: dart-origin}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dart-origin}
  template:
    metadata:
      labels: {app: dart-origin}
    spec:
      initContainers:
        - name: gen
          image: busybox:1.36
          command: ["sh", "/gen/gen.sh"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: gen, mountPath: /gen}
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /blob.bin, port: 80}
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /usr/share/nginx/html, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
      volumes:
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
        - {name: gen, configMap: {name: dart-origin-gen}}
---
apiVersion: v1
kind: Pod
metadata:
  name: dart-toolbox
  labels: {app: dart-toolbox}
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
