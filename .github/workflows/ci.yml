name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: CI here is cheap but not free, and a
# stale run's result is never interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vet + test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The module targets go 1.22; test that floor and a current toolchain, so
        # neither a regression against the declared minimum nor a break on new
        # Go goes unnoticed.
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go.mod is tidy
        run: |
          go mod tidy
          # --porcelain rather than `git diff`, so an untracked go.sum appearing
          # (the first dependency being added) is caught too.
          changed=$(git status --porcelain -- go.mod go.sum)
          if [ -n "$changed" ]; then
            echo "go mod tidy changed the module files:"
            echo "$changed"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The determinism-sensitive packages carry golden values and shuffle
      # invariance tests, so a plain run matters as much as the race run.
      - name: test
        run: go test ./... -count=1

      - name: test -race
        run: go test ./... -race -count=1

      - name: test -cover
        run: go test ./... -cover -count=1

  test-k8s-provider:
    # The EndpointSlice discovery plugin is a separate module (so its client-go
    # tree never enters the main module's go.sum) and needs its own job: the
    # root-module commands above skip nested modules by design.
    name: k8s provider module (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', 'stable']
    defaults:
      run:
        working-directory: providers/k8s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go.mod is tidy
        run: |
          go mod tidy
          changed=$(git status --porcelain -- providers/k8s/go.mod providers/k8s/go.sum)
          if [ -n "$changed" ]; then
            echo "go mod tidy changed the plugin module files:"
            echo "$changed"
            git diff -- providers/k8s/go.mod providers/k8s/go.sum
            exit 1
          fi
        working-directory: .

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test -race -cover
        run: go test ./... -race -cover -count=1

      - name: main module stays dependency-free
        # The whole point of the multi-module layout: regressions here mean a
        # plugin dependency leaked into the main module.
        run: |
          if [ -s go.sum ]; then
            echo "main module grew a go.sum; plugin dependencies must stay in providers/"
            exit 1
          fi
        working-directory: .

  docs:
    name: docs governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: check-docs
        run: bash scripts/check-docs.sh

  cross-build:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      # DART is deployed as a container on both architectures, so both must at
      # least compile on every change.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./cmd/dart

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only: publishing is a separate, credentialed decision. This just
      # keeps the Dockerfile from rotting.
      #
      # SKIP_TESTS=1 because the Dockerfile runs vet+test inside the build stage
      # and the test job above already covers that on Go 1.22 (the version the
      # build stage pins) -- running them again here would only double the wait.
      - name: build image
        run: docker build --build-arg SKIP_TESTS=1 -t dart:ci .

      # The variant is a separate target (see the Dockerfile); keep it building
      # too, since it is what deploy/k8s/rbac.yaml ships with.
      - name: build dart-k8s image
        run: docker build --target dart-k8s --build-arg SKIP_TESTS=1 -t dart-k8s:ci .
